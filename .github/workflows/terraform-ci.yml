name: terraform-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the dev plan after it is generated"
        type: boolean
        default: false

permissions:
  contents: read

env:
  TF_VERSION: "1.12.2"
  TF_IN_AUTOMATION: "true"

jobs:
  # ---------------------------------------------------------------------------
  # Static checks - run on every push/PR, no Azure credentials needed
  # ---------------------------------------------------------------------------
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive -diff

  validate:
    name: validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - modules/hub-network
          - modules/spoke-network
          - modules/log-analytics
          - modules/key-vault
          - modules/policy
          - modules/aks
          - modules/monitoring
          - modules/backup
          - environments/dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: terraform init
        working-directory: ${{ matrix.dir }}
        run: terraform init -backend=false -input=false
      - name: terraform validate
        working-directory: ${{ matrix.dir }}
        run: terraform validate -no-color

  test:
    name: terraform test (mocked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: terraform test
        working-directory: environments/dev
        run: |
          terraform init -backend=false -input=false
          terraform test -no-color

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  checkov:
    name: checkov security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install checkov (pinned for repeatable results)
        run: pip install checkov==3.3.29
      - name: checkov
        run: >
          checkov -d . --config-file .checkov.yaml
          -o cli -o sarif --output-file-path console,results.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true   # code scanning may be unavailable on private repos
        with:
          sarif_file: results.sarif

  # ---------------------------------------------------------------------------
  # Plan / apply against Azure - only runs once OIDC is configured.
  # Set repository variable AZURE_PLAN_ENABLED=true and the secrets listed in
  # the README to turn it on.
  # ---------------------------------------------------------------------------
  plan:
    name: plan (dev)
    needs: [fmt, validate, test, tflint]
    if: vars.AZURE_PLAN_ENABLED == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # OIDC token for Azure login (no client secret)
      pull-requests: write  # comment the plan on the PR
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_owner: ${{ vars.TF_OWNER }}
      TF_VAR_cost_center: ${{ vars.TF_COST_CENTER }}
    defaults:
      run:
        working-directory: environments/dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=landing-zone/dev.tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"
      - name: terraform plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan | tee plan.txt
      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('environments/dev/plan.txt', 'utf8');
            const body = '### Terraform plan (dev)\n<details><summary>Show plan</summary>\n\n```\n' +
              plan.slice(-60000) + '\n```\n</details>';
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body
            });
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev
          path: environments/dev/tfplan
          retention-days: 5

  apply:
    name: apply (dev)
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.apply
    runs-on: ubuntu-latest
    environment: dev          # add required reviewers on this environment
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    defaults:
      run:
        working-directory: environments/dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: tfplan-dev
          path: environments/dev
      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=landing-zone/dev.tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"
      - name: terraform apply
        run: terraform apply -input=false -auto-approve tfplan
